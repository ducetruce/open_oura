<meta charset="utf-8">
<title>Yalla Masri</title>
<meta name="description" content="A complete Egyptian Arabic course from A1 to C2: alphabet, 50 units, trainers, spaced repetition and an AI tutor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root{
  --bg:#E9EEEB; --surface:#F8FAF8; --surface-2:#DDE5E1; --ink:#13222A; --muted:#51666D;
  --line:#C4D0CB; --accent:#1E4FA0; --accent-ink:#FFFFFF; --accent-soft:#D4DEF1;
  --gold:#A06C16; --gold-soft:#F1E2C3; --good:#26744A; --good-soft:#D2EADA; --bad:#AB3434; --bad-soft:#F3D6D4;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-ar:"Noto Naskh Arabic","Geeza Pro","Arial",serif;
  --f-kufi:"Reem Kufi","Noto Naskh Arabic","Geeza Pro",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 2px rgb(10 30 40 / .08), 0 4px 14px rgb(10 30 40 / .05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1417; --surface:#142026; --surface-2:#1C2B32; --ink:#E2EBE8; --muted:#92A6AB;
    --line:#2A3B42; --accent:#86ABEF; --accent-ink:#0A1322; --accent-soft:#1C2C4A;
    --gold:#DCAB55; --gold-soft:#3A2F1A; --good:#63C48F; --good-soft:#163226; --bad:#E47B77; --bad-soft:#3B1E1E;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1417; --surface:#142026; --surface-2:#1C2B32; --ink:#E2EBE8; --muted:#92A6AB;
  --line:#2A3B42; --accent:#86ABEF; --accent-ink:#0A1322; --accent-soft:#1C2C4A;
  --gold:#DCAB55; --gold-soft:#3A2F1A; --good:#63C48F; --good-soft:#163226; --bad:#E47B77; --bad-soft:#3B1E1E;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.6}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate;line-height:1.6}
.tr{font-family:var(--f-mono);font-size:.9em;color:var(--muted)}
.en{color:var(--ink)}
.note{color:var(--muted);font-size:14px;margin:6px 0}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.lead{color:var(--muted);font-size:17px;max-width:62ch;margin:6px 0 0}
h1{font:700 clamp(26px,4.2vw,38px)/1.15 var(--f-display);letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
h2{font:700 20px/1.25 var(--f-display);margin:22px 0 10px;text-wrap:balance}
h3{font:700 16px/1.3 var(--f-display);margin:18px 0 8px}
.grow{flex:1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.center{justify-content:center}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.bar input[type=search],.bar input[type=text]{flex:1;min-width:0}
select,input[type=search],input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;max-width:100%}
textarea{width:100%;resize:vertical}
.check{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}

/* app chrome */
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;white-space:nowrap}
.brand b{font:700 22px/1 var(--f-display);letter-spacing:-.02em}
.brand .ar{font:700 20px/1 var(--f-kufi);color:var(--accent)}
.nav{display:flex;gap:2px;margin-left:8px}
.nav button{border:0;background:none;padding:8px 12px;border-radius:9px;color:var(--muted);font-weight:700;font-size:15px}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav button:hover{color:var(--ink)}
#hdr-stats{margin-left:auto;display:flex;gap:10px;font-size:13px;color:var(--muted);align-items:center}
.hstat b{color:var(--ink);font-variant-numeric:tabular-nums}
.hstat.streak b{color:var(--gold)}
.hstat.sync{font-size:12px}
.hstat.sync.synced{color:var(--good)}
.gear{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px}
main{max-width:1120px;width:100%;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
.bottomnav{display:none}
@media (max-width:820px){
  .nav{display:none}
  .hstat.sync{display:none}
  .topbar-in{gap:10px}
  #hdr-stats{gap:8px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottomnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
  .bottomnav button span{font-size:18px;line-height:1}
  .bottomnav button[aria-current="page"]{color:var(--accent)}
}

/* shared blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.panel>h2:first-child{margin-top:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;text-align:center}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.danger-t{color:var(--bad)}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;margin-bottom:4px}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.speak:hover{border-color:var(--accent);color:var(--accent)}
.speak svg{width:17px;height:17px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.l{background:var(--gold-soft);color:var(--gold)}
.pill.k{background:var(--good-soft);color:var(--good)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.linkish{border:0;background:none;color:var(--accent);font-size:13px;padding:0;font-weight:700}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.tbl{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td .ar{font-size:20px}
.tr-cell{font-family:var(--f-mono);font-size:.9em}
.small{font-size:13px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding-block:10px 22px}
.hero h1{font-size:clamp(28px,5vw,46px);max-width:20ch}
.hero .row{margin-top:18px}
.hero-ar .kufi{font:700 clamp(54px,9vw,104px)/1.1 var(--f-kufi);color:var(--accent);opacity:.9}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero-ar{display:none}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}
.plan{display:grid;gap:8px}
.plan-item{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}
.plan-item:hover{border-color:var(--accent)}
.plan-item.dim{opacity:.65}
.plan-item b{display:block}
.plan-item small{color:var(--muted)}
.pi-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:17px;flex:none}
.ladder{display:grid;gap:6px}
.rung{display:grid;grid-template-columns:44px 1fr 90px 46px;gap:10px;align-items:center;border:1px solid transparent;background:none;border-radius:10px;padding:8px;text-align:left}
.rung:hover{border-color:var(--line)}
.rung.current{border-color:var(--accent);background:var(--accent-soft)}
.rung-lv{font:700 18px var(--f-display)}
.rung-name{font-size:14px}
.rung-pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* course */
.page-head{margin-bottom:14px}
.lvtabs,.utabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;overflow-x:auto;max-width:100%}
.lvtabs button,.utabs button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.lvtabs button small{font-family:var(--f-mono);font-size:11px;font-weight:400}
.lvtabs button[aria-selected="true"],.utabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.lvdesc{margin:14px 0}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.unit-card{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.unit-card:hover{border-color:var(--accent)}
.unit-card.done{border-color:var(--good)}
.uc-top{display:flex;justify-content:space-between;align-items:center;min-height:22px}
.uc-n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.uc-t{font:700 17px/1.25 var(--f-display)}
.uc-ar{font-size:18px;color:var(--accent);text-align:left}
.uc-g{color:var(--muted);font-size:13px;flex:1}

.bank-card:has(.wordlist:not([hidden])){grid-column:1/-1}
.bank-card .row{margin-top:auto}
/* unit */
.unit-head h1 .h-ar{font-size:.72em;color:var(--accent);font-weight:600;margin-inline-start:8px}
.goals{margin:4px 0 12px;padding-left:20px;color:var(--muted);columns:2 280px}
.unit-prog{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;max-width:420px;margin-bottom:14px}
.tick{color:var(--good);font-size:13px}
.unit-body{padding-block:12px}
.lsec{max-width:760px}
.lsec p,.lsec li{max-width:68ch}
.examples{display:grid;gap:8px;margin:10px 0}
.ex{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.2fr);gap:4px 14px;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.ex .row{justify-content:flex-end}
.ex-ar{font-size:22px}
@media (max-width:640px){.ex{grid-template-columns:1fr}.ex .row{justify-content:flex-start}}
.culture{background:var(--gold-soft);border-radius:var(--r);padding:4px 18px 10px;margin-top:18px}
.culture h2{color:var(--gold)}
.step-done{margin:24px 0 8px}
.unit-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:28px;padding-top:14px;flex-wrap:wrap}
.dlg{display:grid;gap:10px;margin:12px 0}
.dline{max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;transition:border-color .2s}
.dline.b{margin-inline-start:auto;background:var(--accent-soft);border-color:transparent}
.dline.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.who{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dline .row{justify-content:space-between;flex-wrap:nowrap}
.d-ar{font-size:23px}
.wordlist{display:grid;gap:0;margin:8px 0}
.witem{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) minmax(0,1.3fr) auto;gap:4px 12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.w-ar{font-size:22px;text-align:right}
.w-note{grid-column:1/-1;margin:0}
@media (max-width:640px){.witem{grid-template-columns:minmax(0,1fr) auto auto}.witem .tr{grid-column:1/-1}.witem .w-en{grid-column:1/2}}
.reading-text{display:grid;gap:12px;margin:12px 0;max-width:760px}
.rline{padding:10px 0;border-bottom:1px dashed var(--line)}
.r-ar{font-size:23px}
.rline .row{justify-content:space-between;flex-wrap:nowrap}
.letters .big-l{font-size:34px}
.letters .form{font-size:26px}
.numerals{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin:10px 0}
.numerals div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;justify-items:center}
.numerals b{font-size:28px}

/* quiz */
.qz{margin-top:14px}
.qz-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-bottom:10px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.qz-body{display:grid;gap:14px}
.qz-prompt{display:grid;gap:6px;justify-items:center;text-align:center;padding:14px 0}
.q-ar{font:600 clamp(30px,6vw,46px)/1.6 var(--f-ar)}
.q-tr{font-size:17px}
.q-text{font:700 clamp(20px,3.4vw,26px)/1.3 var(--f-display);text-wrap:balance;max-width:34ch}
.q-text .ar{font-weight:600}
.q-en{color:var(--muted)}
.big-listen{font-size:18px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;gap:12px;align-items:center;min-height:58px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt kbd{font:500 12px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:none}
.opt-l{display:grid;gap:2px}
.opt-l .ar{font-size:22px;text-align:left}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.type-in{width:100%;font-size:20px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.type-in.ok{border-color:var(--good);background:var(--good-soft)}
.type-in.bad{border-color:var(--bad);background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px;border-radius:12px}
.tiles.line{border:2px dashed var(--line)}
.tiles.line.ok{border-color:var(--good);background:var(--good-soft)}
.tiles.line.bad{border-color:var(--bad);background:var(--bad-soft)}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;display:grid;justify-items:center;box-shadow:var(--shadow)}
.tile .ar{font-size:21px}
.tile small{font-size:11px}
.qz-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.feedback{border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.feedback.good{background:var(--good-soft)} .feedback.bad{background:var(--bad-soft)}
.feedback>b{font-family:var(--f-display)}
.fb-ans{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fb-ans .ar{font-size:22px}
.ai-out{white-space:pre-wrap}
.result{display:grid;gap:8px;justify-items:start}
.score{font:700 64px/1 var(--f-display);font-variant-numeric:tabular-nums}
.missed{width:100%}
.miss-row{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.miss-row .ar{font-size:20px}
.kb{display:grid;gap:5px;padding:8px;background:var(--surface-2);border-radius:12px}
.kb-row{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.kb-k{min-width:34px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:20px;padding:0 6px}
.kb-k.wide{font-family:var(--f-body);font-size:13px;min-width:90px}

/* review card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px 22px;min-height:320px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);margin-top:6px}
.card-meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.face{flex:1;display:grid;place-items:center;text-align:center;gap:6px}
.big-ar{font:600 clamp(40px,8vw,64px)/1.5 var(--f-ar)}
.big-en{font:700 clamp(24px,4.6vw,36px)/1.25 var(--f-display);text-wrap:balance}
.sub{font-size:18px}
.answer{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:6px;text-align:center;justify-items:center}
.en-ans{font:700 22px/1.3 var(--f-display)}
.ar-ans{font:600 36px/1.5 var(--f-ar)}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.actions.one{grid-template-columns:1fr}
.rate{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;display:grid;gap:2px;font-weight:700}
.rate small,.rate kbd{font:400 12px var(--f-mono);color:var(--muted)}
.rate.again{border-color:var(--bad);color:var(--bad)} .rate.hard{border-color:var(--gold);color:var(--gold)}
.rate.good{border-color:var(--good);color:var(--good)} .rate.easy{border-color:var(--accent);color:var(--accent)}
.done{display:grid;place-items:center;gap:6px;flex:1;text-align:center}
.done .kufi,.kufi{font-family:var(--f-kufi);font-weight:700}
.done .kufi{font-size:44px;color:var(--accent)}
.hint{font-size:13px;color:var(--muted);text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* practice */
.tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px;margin:14px 0}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;text-align:left;display:grid;gap:4px;box-shadow:var(--shadow)}
.tool:hover{border-color:var(--accent)}
.tool b{font:700 17px var(--f-display)}
.tool small{color:var(--muted)}
.conj .conj-ar{font-size:22px}
.small-ar{font-size:15px!important;color:var(--muted)}

/* tutor */
.tutor-box{margin-top:14px}
.scenarios{display:grid;gap:12px}
.sc-group{display:grid;gap:6px}
.sc-group>.chipbtn,.sc-group{justify-items:start}
.sc-group{grid-template-columns:1fr}
.sc-group .label{margin-bottom:2px}
.sc-group.current .label{color:var(--accent);font-weight:700}
.sc-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sc-group .label{width:100%}
.chat-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chat-head h2{margin:2px 0}
.chat{display:grid;gap:10px;max-height:min(60vh,560px);overflow-y:auto;padding:10px 2px;margin:10px 0}
.bubble{max-width:min(92%,640px);border-radius:14px;padding:10px 14px;display:grid;gap:4px}
.bubble.them{background:var(--accent-soft)}
.bubble.me{background:var(--surface-2);margin-inline-start:auto}
.bubble.sys{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:14px;white-space:pre-wrap}
.bubble .row{justify-content:space-between;flex-wrap:nowrap}
.chat-ar{font-size:21px}
.bubble .linkish{justify-self:start}
.typing{color:var(--muted);font-style:italic}
.chat-fb{border-radius:10px;padding:8px 10px;margin-top:6px;display:grid;gap:4px;font-size:14px}
.chat-fb.good{background:var(--good-soft)} .chat-fb.bad{background:var(--bad-soft)}
.chat-fb .ar{font-size:19px}
.chat-bar{display:grid;gap:8px}
.ai-text{white-space:pre-wrap;line-height:1.7;margin-top:12px}
.ai-off{max-width:640px}
.w-in{font-size:18px}

/* settings */
.set{display:grid;gap:8px;max-width:680px;margin-bottom:16px}
.set label{font-weight:700;margin-top:6px}
.franco{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.franco div{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.franco b{font:500 18px var(--f-mono);color:var(--accent)}
.franco .ar{font-size:20px;text-align:left}
.franco small{color:var(--muted);font-size:12px}
@media (max-width:400px){.brand .ar{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
