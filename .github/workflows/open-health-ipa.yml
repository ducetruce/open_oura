# Builds an UNSIGNED IPA of the iOS app in ducetruce/open_health (model-free build)
# on a macOS runner and uploads it as a workflow artifact, ready to be signed.
# Same steps as open_health's own build-unsigned-ipa.yml, run from this repository.
#
# Run it from the Actions tab ("Run workflow"), then download the
# "OuraApp-unsigned-ipa" artifact from the finished run.
name: Open Health unsigned IPA

on:
  workflow_dispatch:
    inputs:
      repository:
        description: repository to build
        default: ducetruce/open_health
      ref:
        description: commit, tag or branch to build
        default: overhaul
      runner:
        description: GitHub macOS image
        type: choice
        default: macos-15
        options: [macos-15, macos-26, macos-latest]
  push:
    branches: [claude/sleepy-mccarthy-hwlbz6]
    paths: [.github/workflows/open-health-ipa.yml]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || 'ducetruce/open_health' }}
          ref: ${{ inputs.ref || 'overhaul' }}

      - name: Install Rust + iOS targets
        run: |
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Build Rust xcframework
        run: bash apps/ios/build-xcframework.sh

      - name: Generate Xcode project (model-free)
        working-directory: apps/ios/OuraApp
        run: xcodegen generate --spec project-ci.yml

      - name: Build app without code signing
        working-directory: apps/ios/OuraApp
        run: |
          xcodebuild -project OuraApp.xcodeproj -scheme OuraApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        working-directory: apps/ios/OuraApp
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OuraApp.app Payload/
          zip -qry OuraApp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OuraApp-unsigned-ipa
          path: apps/ios/OuraApp/OuraApp-unsigned.ipa
