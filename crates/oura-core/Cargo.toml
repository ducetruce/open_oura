[package]
name = "oura-core"
description = "UniFFI bridge exposing the Oura ring client (sync, storage, daily summary) to the iOS app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Host-only: builds the `uniffi-bindgen` binary used to generate the Swift bindings.
bindgen = ["uniffi/cli"]

[dependencies]
oura-protocol = { path = "../oura-protocol" }
# No `ble` feature: on iOS the Swift side owns CoreBluetooth and implements the link.
oura-link = { path = "../oura-link", default-features = false }
oura-analysis = { path = "../oura-analysis" }
oura-store = { path = "../oura-store" }
uniffi = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
serde_json = "1"
thiserror = "1"
hex = "0.4"
getrandom = "0.2"
